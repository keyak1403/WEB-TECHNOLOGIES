<DOCTYPE!>
<html>
 <body>
   <h1>School Book Store Survey</h1>
 <hr>
 <form>
   <h2>Student Information</h2

   <p>
    <lable for="fullname">Fullname</lable><br>
    <input type="text" name="name"
   </p>
  
   <p>
    <lable for="Branch">Branch</lable><br>
    <input type="text" name="Branch"
   </p>

   <p>
    <lable for="Email Id">Email Id</lable><br>  
    <input type="text" name="Email Id"
   </p>

   <p>
    <lable for="Contact No.">Contact No.</lable><br>
    <input type="text" name="Contact No."   
   </p>

   <p>
    <lable for="Address">Address</lable><br>
    <input type="text" name="Address">
   </p>
 <hr>
   
   <h2>Book-Buying Habbits</h2>

   <p>
    <strong>How often do you visit bookstore?</strong><br>
    <input type="radio"  name="visit">
    <lable for="visit">Daily</lable><br> 
    
    <input type="radio"  name="visit">
    <lable for="visit">Weekly</lable><br> 

    <input type="radio"  name="visit">
    <lable for="visit">Monthly</lable><br> 

    <input type="radio"  name="visit">
    <lable for="visit">Yearly</lable><br> 
   </p>

   <p>
    <strong>From where do you primarily buy your books?</strong><br>
            <input type="radio" name="books">
            <label for="bookstore">Bookstore</label><br>

            <input type="radio" name="books">
            <label for="online">Online Retailers (e.g., Amazon)</label><br>

            <input type="radio" name="books">
            <label for="off_campus">Library</label><br>
   </p>

   <p>
            <label for="spend">How much do you spend when you go to bookstore?</label><br>
            <select id="spend" name="spend">
                <option value="under_100">Under $100</option>
                <option value="100_300">$100 - $300</option>
                <option value="300_500">$300 - $500</option>
                <option value="over_500">Over $500</option>
            </select>
        </p>

   <p>
        <lable for="Feedback">Feedback</lable><br>
        <input type="text" name="Feedback">
      <textarea="Feedback" name="Feedback" rows="4" columns="50" placeholder="excellent, etc"></textarea>
   </p>

  <p>
            <input type="submit" value="Submit Survey">
            <input type="reset" value="Clear Form">
      </p>

  </form>
</html>
